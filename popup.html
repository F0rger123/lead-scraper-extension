<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 380px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; }
    .header { background: linear-gradient(135deg, #1e3a5f, #3b82f6); padding: 16px; text-align: center; }
    .header h1 { font-size: 18px; font-weight: 700; color: white; }
    .header p { font-size: 12px; color: #93c5fd; margin-top: 4px; }
    .stats { display: flex; justify-content: space-around; padding: 12px; background: #1e293b; border-bottom: 1px solid #334155; }
    .stat { text-align: center; }
    .stat-num { font-size: 24px; font-weight: 700; color: #3b82f6; }
    .stat-label { font-size: 11px; color: #94a3b8; }
    .section { padding: 12px; border-bottom: 1px solid #334155; }
    .section-title { font-size: 13px; font-weight: 600; color: #94a3b8; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
    .btn { width: 100%; padding: 10px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; margin-bottom: 6px; transition: all 0.2s; }
    .btn-primary { background: #3b82f6; color: white; }
    .btn-primary:hover { background: #2563eb; }
    .btn-success { background: #22c55e; color: white; }
    .btn-success:hover { background: #16a34a; }
    .btn-danger { background: #ef4444; color: white; }
    .btn-danger:hover { background: #dc2626; }
    .btn-outline { background: transparent; border: 1px solid #475569; color: #e2e8f0; }
    .btn-outline:hover { background: #1e293b; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .input-group { margin-bottom: 8px; }
    .input-group label { font-size: 11px; color: #94a3b8; display: block; margin-bottom: 3px; }
    .input-group input { width: 100%; padding: 8px; border: 1px solid #475569; border-radius: 6px; background: #1e293b; color: #e2e8f0; font-size: 12px; }
    .input-group input:focus { border-color: #3b82f6; outline: none; }
    .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
    .status-dot.connected { background: #22c55e; }
    .status-dot.disconnected { background: #ef4444; }
    .lead-list { max-height: 180px; overflow-y: auto; }
    .lead-item { padding: 8px; background: #1e293b; border-radius: 6px; margin-bottom: 4px; font-size: 12px; cursor: pointer; }
    .lead-item:hover { background: #334155; }
    .lead-addr { color: #e2e8f0; font-weight: 600; }
    .lead-meta { color: #94a3b8; margin-top: 2px; }
    .footer { padding: 8px 12px; text-align: center; font-size: 11px; color: #64748b; }
    .hidden { display: none; }
    .toast { padding: 8px 12px; border-radius: 8px; font-size: 12px; margin-bottom: 8px; }
    .toast-success { background: #14532d; color: #86efac; }
    .toast-error { background: #450a0a; color: #fca5a5; }
    .toast-info { background: #1e3a5f; color: #93c5fd; }
  </style>
</head>
<body>
  <div class="header">
    <h1>🛠️ Lead Scraper v2</h1>
    <p>Jarvis — Auto skip trace + Google Sheets</p>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-num" id="leadCount">0</div>
      <div class="stat-label">Pending</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="todayCount">0</div>
      <div class="stat-label">Today</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="sheetStatus">—</div>
      <div class="stat-label">Sheet</div>
    </div>
  </div>

  <div id="toastContainer"></div>

  <div class="section">
    <div class="section-title">⚡ Quick Actions</div>
    <button class="btn btn-success" id="pushSheetBtn">📊 Push All to Google Sheet</button>
    <button class="btn btn-primary" id="exportBtn">📁 Export CSV</button>
    <button class="btn btn-outline" id="viewLeadsBtn">📋 View Pending Leads</button>
  </div>

  <div class="section lead-list hidden" id="leadListSection">
    <div class="section-title">📋 Pending Leads</div>
    <div id="leadList"></div>
  </div>

  <div class="section">
    <div class="section-title">⚙️ Google Sheets Connection</div>
    <div class="input-group">
      <label>Google Sheet ID</label>
      <input type="text" id="sheetId" placeholder="1GjB4P5SKiMoZDrlkuOvgetpynYhE0yTPFm-R56NLZhg">
    </div>
    <div class="input-group">
      <label>Access Token <a href="#" id="getTokenLink" style="color:#3b82f6;font-size:10px;">(get one)</a></label>
      <input type="text" id="accessToken" placeholder="ya29.a0..." style="font-size:11px;">
    </div>
    <div class="input-group">
      <label>Sheet/Tab Name</label>
      <input type="text" id="sheetName" placeholder="Leads" value="Leads">
    </div>
    <div style="display:flex;gap:6px;">
      <button class="btn btn-primary" id="testBtn" style="flex:1;">🔗 Test</button>
      <button class="btn btn-success" id="saveBtn" style="flex:1;">💾 Save</button>
    </div>
  </div>

  <div class="section">
    <button class="btn btn-danger" id="clearBtn">🗑️ Clear All Leads</button>
  </div>

  <div class="footer">
    Jarvis Lead Scraper v2.0 — PropWire · Zillow · Homes.com · Trulia
  </div>

  <script src="popup.js"></script>
</body>
</html>
